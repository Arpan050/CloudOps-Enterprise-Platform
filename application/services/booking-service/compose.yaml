services:
  db:
    image: postgres:16-alpine
    container_name: cloudops-booking-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - booking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops_booking -d cloudops_booking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  booking_pgdata:
